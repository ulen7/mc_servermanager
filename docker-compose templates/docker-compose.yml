services:
  minecraft:
    image: itzg/minecraft-server
    container_name: mc_server
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      - "19132:19132/udp"
    environment:
      EULA: "TRUE"
      VERSION: "1.21.6"
      TYPE: "FABRIC"
      MEMORY: "2G"
      SERVER_PORT: "25565"
      MAX_PLAYERS: "4"
      MODE: "creative"
      RESOURCE_PACK_ENFORCE: "TRUE"
      SEED: "46182117"
      MODRINTH_PROJECTS: "fabric-api"
    volumes:
      - ./mc_server:/data
